[project]
name = "performance-planning-qa"
version = "0.1.0"
description = "Natural-language to Teradata SQL and analytical Q&A for performance planning tables"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "httpx",
    "json-repair>=0.61.2",
    "psycopg[binary]",
    "python-dotenv",
    "requests",
    "streamlit>=1.59.1,<1.60",
    "teradataml",
    "uvicorn[standard]",
    "watchdog>=6.0.0",
]

[project.scripts]
performance-planning-qa = "performance_planning_qa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
