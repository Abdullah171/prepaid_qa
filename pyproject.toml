[project]
name = "performance-planning-qa"
version = "0.1.0"
description = "Natural-language to Teradata SQL and analytical Q&A for performance planning tables"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "httpx",
    "openai",
    "python-dotenv",
    "teradataml",
    "uvicorn[standard]",
]

[project.scripts]
performance-planning-qa = "performance_planning_qa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
